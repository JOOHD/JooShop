<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문내역</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fragments/header.css">
</head>
<body class="bg-light">

<!-- 헤더 -->
<div th:replace="~{fragments/header :: headerWithBanner}"></div>

<div class="container mt-5" style="max-width: 900px;">
    <h2 class="mb-4">주문내역</h2>

    <div class="table-responsive">
        <table class="table table-hover align-middle" id="orderTable">
            <thead class="table-light">
            <tr>
                <th>주문번호</th>
                <th>상품</th>
                <th>총 결제금액</th>
                <th>주문 상태</th>
                <th>주문일시</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <!-- JS로 렌더링 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {

        function formatStatus(status) {
            switch (status) {
                case "PENDING": return "결제 대기";
                case "COMPLETE": return "결제 완료";   // PaymentStatus 실제 값 (PENDING/COMPLETE/CANCELED)
                case "CANCELED": return "주문 취소";
                case "PAID": return "결제 완료";
                case "SHIPPED": return "배송 중";
                case "DELIVERED": return "배송 완료";
                default: return status ?? "알 수 없음";
            }
        }

        async function loadMyOrders() {
            const tbody = document.querySelector("#orderTable tbody");

            try {
                const res = await fetch("/api/v1/order/my");
                if (!res.ok) throw new Error("주문내역 조회 실패");

                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center">주문 내역이 없습니다.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                orders.forEach(o => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${o.orderId}</td>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img src="${o.thumbnail || "/logo/icons/mufc_icon.png"}" alt=""
                                     width="64" height="64"
                                     style="object-fit: cover; border-radius: 8px; background: #f0f0f0; flex-shrink: 0;"
                                     onerror="this.onerror=null; this.src='/logo/icons/mufc_icon.png';">
                                <span>${o.productSummary ?? ""}</span>
                            </div>
                        </td>
                        <td>${Number(o.totalPrice).toLocaleString()}원</td>
                        <td>${formatStatus(o.status)}</td>
                        <td>${new Intl.DateTimeFormat("ko-KR", {
                            dateStyle: "medium",
                            timeStyle: "short"
                        }).format(new Date(o.orderDate))}</td>
                        <td>${o.status === "COMPLETE"
                            ? `<button type="button" class="btn btn-outline-danger btn-sm" data-cancel-order="${o.orderId}">주문 취소</button>`
                            : ""}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">주문내역을 불러오지 못했습니다.</td></tr>`;
            }
        }

        // 주문 취소 — 결제 완료(COMPLETE) 주문만 버튼이 보인다. 서버가 소유자 확인, 환불, 재고 복구까지 처리한다.
        async function cancelOrder(orderId, button) {
            if (!confirm("이 주문을 취소할까요? 결제 금액이 환불됩니다.")) return;

            button.disabled = true;
            try {
                const res = await fetch(`/api/v1/payment/cancel/order/${orderId}`, { method: "POST" });
                if (!res.ok) {
                    let message = "주문 취소에 실패했습니다.";
                    try { message = (await res.json()).message || message; } catch (e) { /* JSON이 아니면 기본 문구 */ }
                    throw new Error(message);
                }
                alert("주문이 취소되었습니다.");
                loadMyOrders();   // 목록을 다시 불러와 상태를 갱신
            } catch (e) {
                alert(e.message);
                button.disabled = false;
            }
        }

        // 목록은 JS로 다시 그려지므로, 버튼 클릭은 표 전체에서 한 번에 받는다(이벤트 위임)
        document.querySelector("#orderTable tbody").addEventListener("click", (event) => {
            const button = event.target.closest("[data-cancel-order]");
            if (button) cancelOrder(button.dataset.cancelOrder, button);
        });

        loadMyOrders();
    });
</script>
</body>
</html>
